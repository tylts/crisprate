<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Restaurant - CrispRate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 500px; margin-top: 60px;">

    <a th:href="@{/admin}" class="btn btn-link ps-0">&larr; Back to admin page</a>
    <h1 class="mb-4">Edit a restaurant location</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/establishments/{id}/edit(id=${establishment.id})}" method="post">

        <div class="mb-3">
            <label for="name" class="form-label">Restaurant Name</label>
            <input type="text" class="form-control" id="name" name="name" required
                   th:value="${establishment.name}">
        </div>

        <div th:if="${establishment instanceof T(com.crisprate.crisprate.entity.FastFoodChain)}" class="mb-3">
            <label for="chainName" class="form-label">Chain Name <span class="text-muted">(only if chain location)</span></label>
            <input type="text" class="form-control" id="chainName" name="chainName"
                   th:value="${establishment.chainName}">
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" name="address" required
                   th:value="${establishment.address}">
        </div>

        <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" name="city" required th:value="${establishment.city}">
        </div>

        <button type="submit" class="btn btn-primary">Update restaurant</button>

    </form>

</div>
</body>
</html>
