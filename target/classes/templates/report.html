<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crispiness Report - CrispRate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 800px; margin-top: 40px;">

    <a th:href="@{/}" class="btn btn-link ps-0">&larr; Back to search</a>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h1>Crispiness Report</h1>
        <a th:href="@{/reports/export(city=${cityFilter})}" class="btn btn-outline-primary btn-sm">Export CSV</a>
    </div>
    <p class="text-muted">
        Generated <span th:text="${#temporals.format(generatedAt, 'MMM d, yyyy h:m a')}"></span>
    </p>

    <form th:action="@{/reports}" method="get" class="row g-2 mb-4">
        <div class="col">
            <input type="text" class="form-control" name="city" placeholder="Filter by city"
                   th:value="${cityFilter}">
        </div>
        <div class="col-auto">
            <a th:href="@{/reports}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <table class="table">
        <thead>
        <tr>
            <th>Restaurant</th>
            <th>City</th>
            <th>Average Score</th>
            <th># of Ratings</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}">
            <td th:text="${row.name}"></td>
            <td th:text="${row.city}"></td>
            <td th:text="${#numbers.formatDecimal(row.averageScore, 1, 1)}"></td>
            <td th:text="${row.ratingCount}"></td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(rows)}" class="text-muted">No results.</div>
</div>
</body>
</html>
