<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - CrispRate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 900px; margin-top: 40px">
    <a th:href="@{/}" class="btn btn-link ps-0">&larr; Back to CrispRate</a>
    <h1 class="mb-4">Admin Dashboard</h1>

    <h4>Restaurant Locations</h4>
    <table class="table table-sm">
        <thead>
        <tr><th>Name</th><th>City</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="e : ${establishments}">
            <td th:text="${e.name}"></td>
            <td th:text="${e.city}"></td>
            <td>
                <form th:action="@{/admin/establishments/{id}/delete(id=${e.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                </form>
                <a th:href="@{/admin/establishments/{id}/edit(id=${e.id})}" class="btn btn-outline-secondary btn-sm">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>

    <h4 class="mt-4">All Ratings</h4>
    <table class="table table-sm">
        <thead>
        <tr><th>User</th><th>Score</th><th>Comment</th><th>Date</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${ratings}">
            <td th:text="${r.user.username}"></td>
            <td th:text="${r.score}"></td>
            <td th:text="${r.comment}"></td>
            <td th:text="${#temporals.format(r.createdAt, 'MMM d, yyyy')}"></td>
            <td>
                <form th:action="@{/admin/ratings/{id}/delete(id=${r.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>



</div>
</body>
</html>
