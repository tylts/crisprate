<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - CrispRate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 480px; margin-top: 80px;">
    <h1 class="mb-4">Login to rate the crisp!</h1>

    <div th:if="${param.registered}" class="alert alert-success">
        Account created! Please log in below.
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        Invalid username or password.
    </div>



    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>

    </form>
    <p class="mt-3">Don't have an account? <a th:href="@{/register}">Register</a></p>
</div>

</body>
</html>
