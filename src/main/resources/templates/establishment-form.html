<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add a Restaurant - CrispRate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 500px; margin-top: 60px;">

    <a th:href="@{/}" class="btn btn-link ps-0">&larr; Back to search</a>
    <h1 class="mb-4">Add a restaurant location</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/establishments}" method="post">
        <div class="mb-3">
            <label class="form-label d-block">Type</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="type" value="RESTAURANT" id="typeRestaurant"
                       th:checked="${type == null or type == 'RESTAURANT'}">
                <label class="form-check-label" for="typeRestaurant">Independent Restaurant</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="type" value="FAST_FOOD_CHAIN" id="typeChain"
                       th:checked="${type == 'FAST_FOOD_CHAIN'}">
                <label class="form-check-label" for="typeChain">Fast Food Chain Restaurant</label>
            </div>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label">Restaurant Name</label>
            <input type="text" class="form-control" id="name" name="name" required
                   th:value="${name}">
        </div>

        <div class="mb-3">
            <label for="chainName" class="form-label">Chain Name <span class="text-muted">(only if chain location)</span></label>
            <input type="text" class="form-control" id="chainName" name="chainName" placeholder="e.g. Taco Bueno"
                   th:value="${chainName}">
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" name="address" required
                   th:value="${address}">
        </div>

        <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" name="city" required th:value="${city}">
        </div>

        <button type="submit" class="btn btn-primary">Add restaurant</button>

    </form>

</div>
</body>
</html>
