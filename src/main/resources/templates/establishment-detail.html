<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${establishment.name} + ' - CrispRate'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 700px; margin-top: 40px">
    <a th:href="@{/}" class="btn btn-link ps-0">&larr; Back to search</a>

    <div class="d-flex justify-content-between align-items-start mb-2">
        <div>
            <h1 th:text="${establishment.name}"></h1>
            <p class="text-muted mb-0" th:text="${establishment.address} + ', ' + ${establishment.city}"></p>
        </div>
        <span class="badge bg-primary fs-5" th:text="${#numbers.formatDecimal(score, 1, 1)} + ' / 5'"></span>
    </div>

    <p class="text-muted" th:text="${#lists.size(ratings)} + ' rating(s)'"></p>

    <div sec:authorize="isAuthenticated()" class="my-4 p-3 border rounded">
        <h5>Leave a rating</h5>
        <p class="text-muted small">TO DO: add rating submission form</p>
    </div>

    <div sec:authorize="isAnonymous()" class="my-4 p-3 border rounded bg-light">
        <a th:href="@{/login}">Log in</a> to leave a rating.
    </div>

    <h5 class="mt-4">Recent ratings</h5>
    <div th:if="${#lists.isEmpty(ratings)}" class="text-muted">
        No ratings yet. Be the first!
    </div>

    <div th:each="r : ${ratings}" class="border-bottom py-2">
        <div class="d-flex justify-content-between">
            <strong th:text="${r.score} + ' / 5'"></strong>
            <span class="text-muted-small" th:text="${#temporals.format(r.createdAt, 'MMM d, yyyy')}"></span>
        </div>
        <p class="mb-0" th:text="${r.comment}"></p>
    </div>

</div>
</body>
</html>
