<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Rating - CrispRate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 500px; margin-top: 60px;">

    <a th:href="@{/establishments/{id}(id=${rating.establishment.id})}"
       class="btn btn-link ps-0">&larr; Back</a>
    <h1 class="mb-4">Edit your rating</h1>

    <form th:action="@{edit(id=${rating.id})}" method="post">
        <div class="mb-3">
            <label for="score" class="form-label">Score (1-5)</label>
            <input type="number" class="form-control" id="score" name="score" th:min="1" th:max="5"
                   th:value="${rating.score}" required>
        </div>
        <div class="mb-3">
            <label for="comment" class="form-label">Comment</label>
            <textarea class="form-control" id="comment" name="comment" rows="2" th:text="${rating.comment}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Save changes</button>

    </form>

</div>
</body>
</html>
