<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>CrispRate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 800px; margin-top: 40px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>CrispRate</h1>
        <div>
            <span sec:authorize="isAuthenticated()" class="me-2">
                Logged in as <span sec:authentication="name"></span>
            </span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
            </form>
            <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-outline-primary btn">Log in</a>
            <a sec:authorize="isAnonymous()" th:href="@{/register}" class="btn btn-primary btn">Register</a>
        </div>
    </div>

    <a sec:authorize="isAuthenticated()" th:href="@{/establishments/new}" class="btn btn-success mb-3">+ Add a restaurant</a>
    <a th:href="@{/reports}" class="btn btn-outline-secondary mb-3">View reports</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-outline-secondary mb-3">Admin</a>


    <form th:action="@{/}" method="get" class="row g-2 mb-4">
        <div class="col">
            <input type="text" class="form-control" name="name" placeholder="Search by restaurant name"
            th:value="${searchName}">
        </div>
        <div class="col">
            <input type="text" class="form-control" name="city" placeholder="Search by city"
                   th:value="${searchCity}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
        <div class="col-auto">
            <a th:href="@{/}" class="btn btn-outline-secondary">Search</a>
        </div>
    </form>

    <div class="list-group">
        <a th:each="e : ${establishments}"
           th:href="@{/establishments/{id}(id=${e.id})}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <div>
                <div class="fw-bold" th:text="${e.name}"></div>
                <div class="text-muted small" th:text="${e.city}"></div>
            </div>
            <span class="badge bg-primary rounded-pill" th:text="${#numbers.formatDecimal(scores.get(e.id), 1, 1)} + ' / 5'"></span>
        </a>
    </div>

    <nav th:if="${totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/(name=${searchName}, city=${searchCity}, page=${currentPage - 1})}">Previous</a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/(name=${searchName}, city=${searchCity}, page=${i})}"
                   th:text="${i + 1}"></a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/(name=${searchName}, city=${searchCity}, page=${currentPage + 1})}">Next</a>
            </li>
        </ul>
    </nav>


</div>

</body>
</html>
